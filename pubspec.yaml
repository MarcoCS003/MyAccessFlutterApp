name: cliente_flutter_myaccess
description: "Cliente Flutter para MyAccess IJL - Control de acceso escolar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.3.0
  
  # HTTP y API
  dio: ^5.7.0
  # retrofit: ^4.4.0
  
  # Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  
  # QR
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  
  # UI y utilidades
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.0.1
  
  # Background sync
  workmanager: ^0.10.7
  background_fetch: ^1.3.7
  
  # Code generation annotations
  # freezed_annotation: ^2.4.4
  # json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  # freezed: ^2.5.7
  # json_serializable: ^6.8.0
  # retrofit_generator: ^9.1.0
  # hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
